<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order — Groundwork</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" />
<link rel="stylesheet" href="assets/style.css" />
<script src="https://js.stripe.com/basil/stripe.js"></script>
</head>
<body>

<div class="page">
  <div class="pagehead">
    <a href="/" class="brand"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0c0c0e"/><path d="M8 22.5h16M10.5 18h11M13 13.5h6M15 9h2" stroke="#10b26c" stroke-width="2.6" stroke-linecap="round"/></svg></span><span>Groundwork</span></a>
    <a href="/" class="back">← Back to the catalogue</a>
  </div>

  <p class="result-state" id="stateLabel">checking…</p>
  <h1 id="heading">Checking your payment</h1>
  <p class="lead" id="message">One moment.</p>

  <ul class="summary-list" id="lines" hidden></ul>

  <p class="cta-row">
    <a href="/" class="btn btn-soft btn-lg">Back to the catalogue</a>
  </p>
</div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'groundwork.cart.v1';

  const stateLabel = document.getElementById('stateLabel');
  const heading = document.getElementById('heading');
  const message = document.getElementById('message');
  const lines = document.getElementById('lines');

  const setState = (cls, text) => {
    stateLabel.className = 'result-state ' + cls;
    stateLabel.textContent = text;
  };

  const secret = new URLSearchParams(location.search)
    .get('payment_intent_client_secret');

  if (!secret || typeof Stripe !== 'function') {
    setState('', 'No order');
    heading.textContent = 'Nothing to show';
    message.textContent = 'This page is only reachable after a payment.';
    return;
  }

  // Read what was ordered before the cart is cleared.
  let ordered = [];
  try {
    ordered = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}').items || [];
  } catch { /* nothing to show */ }

  // The publishable key comes from the STRIPE_PUBLISHABLE_KEY environment
  // variable via /api/stripe-config, never from the page itself.
  fetch('/api/stripe-config')
    .then(r => r.json())
    .then(cfg => {
      if (!cfg.publishableKey) throw new Error('not configured');
      return Stripe(cfg.publishableKey).retrievePaymentIntent(secret);
    })
    .catch(() => ({}))
    .then(({ paymentIntent }) => {
    const money = cents =>
      (cents / 100).toLocaleString('en-IE', { style: 'currency', currency: 'EUR' });

    switch (paymentIntent?.status) {
      case 'succeeded':
        setState('good', 'Paid');
        heading.textContent = 'Payment received';
        message.textContent =
          `Thanks — ${money(paymentIntent.amount)} paid. A receipt is on its ` +
          'way to your inbox, and your course access follows in a separate email.';

        if (ordered.length) {
          lines.hidden = false;
          lines.innerHTML = ordered
            .map(i => `<li><span>${i.qty} × ${i.name}</span></li>`)
            .join('');
        }
        localStorage.removeItem(STORAGE_KEY);
        break;

      case 'processing':
        setState('', 'Pending');
        heading.textContent = 'Payment in progress';
        message.textContent =
          'Your bank is still confirming this. We will email you as soon as it clears.';
        break;

      case 'requires_payment_method':
        setState('bad', 'Not completed');
        heading.textContent = 'Payment not completed';
        message.textContent =
          'Nothing was charged. You can go back and try a different method.';
        break;

      default:
        setState('bad', 'Unknown');
        heading.textContent = 'We could not read this order';
        message.textContent =
          'If you were charged, email us and we will sort it out.';
    }
  });
})();
</script>

</body>
</html>
